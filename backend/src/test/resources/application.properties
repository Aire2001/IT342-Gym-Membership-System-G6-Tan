# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (test values)
jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars
jwt.expiration=86400000

# Stripe (test stubs — no real calls made in unit tests)
stripe.secret.key=sk_test_stub
stripe.publishable.key=pk_test_stub

# Google OAuth (test stub)
google.client.id=test-google-client-id

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Disable OAuth2 auto-config for tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

logging.level.edu.cit.tan.GymMembershipPaymentSystem=WARN
logging.level.org.springframework.security=WARN
