# Server Configuration
server.port=8080

# MySQL Database (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/ironpass_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Email (Gmail SMTP) ───────────────────────────────────────────────────────
# Replace with your Gmail address and App Password (Settings → Security → 2-Step → App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Upload size limits (for profile picture base64 payloads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Google OAuth
google.client.id=638364416506-ej3bvnc94ro26di66pjpj3civfhureau.apps.googleusercontent.com

# JWT
jwt.secret=FitLifeGymSecretKey2024SuperSecureJwtSigningKeyForHS256Algorithm!
jwt.expiration=86400000

# Logging
logging.level.edu.cit.tan.GymMembershipPaymentSystem=INFO
logging.level.org.springframework.security=WARN
