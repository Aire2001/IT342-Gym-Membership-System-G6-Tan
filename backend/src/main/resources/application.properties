# Server Configuration
server.port=8080

# MySQL Database (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/ironpass_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# HikariCP - faster pool startup
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ── Email (Gmail SMTP) ───────────────────────────────────────────────────────
# Replace with your Gmail address and App Password (Settings → Security → 2-Step → App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Upload size limits (for profile picture base64 payloads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:your-google-client-id}

# Stripe Payment Gateway (Test Mode)
stripe.secret.key=${STRIPE_SECRET_KEY:your-stripe-secret-key}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:your-stripe-publishable-key}

# JWT
jwt.secret=${JWT_SECRET:your-jwt-secret-min-32-chars}
jwt.expiration=86400000

# Logging
logging.level.edu.cit.tan.GymMembershipPaymentSystem=INFO
logging.level.org.springframework.security=WARN
